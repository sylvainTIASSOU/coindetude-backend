[project]
name = "coindetude-backend"
version = "0.1.0"
description = "API backend de CoinDétude — plateforme de révision pour élèves togolais (CEPD/BEPC/BAC)"
authors = [{ name = "TKMS", email = "contact@coindetude.tg" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi[standard] (>=0.141.0,<0.142.0)",
  "pydantic-settings (>=2.6.0,<3.0.0)",
  "sqlalchemy[asyncio] (>=2.0.36,<3.0.0)",
  "asyncpg (>=0.30.0,<0.31.0)",
  "alembic (>=1.14.0,<2.0.0)",
  "pyjwt[crypto] (>=2.10.0,<3.0.0)",
  "argon2-cffi (>=23.1.0,<24.0.0)",
  "boto3 (>=1.35.0,<2.0.0)",
  "firebase-admin (>=6.6.0,<7.0.0)",
  "httpx (>=0.28.0,<0.29.0)",
  "tenacity (>=9.0.0,<10.0.0)",
  "structlog (>=24.4.0,<25.0.0)",
  "redis[hiredis] (>=5.2.0,<6.0.0)",
  "arq (>=0.28.0,<0.29.0)",
  "passlib (>=1.7.4,<2.0.0)",
  "aioboto3 (>=15.5.0,<16.0.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3.0,<9.0.0"
pytest-asyncio = ">=0.24.0,<0.25.0"
pytest-cov = ">=6.0.0,<7.0.0"
ruff = ">=0.7.0,<1.0.0"
mypy = ">=1.13.0,<2.0.0"
pre-commit = ">=4.0.0,<5.0.0"
aiosqlite = ">=0.20.0,<0.21.0"
factory-boy = ">=3.3.0,<4.0.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

# ---- Ruff : lint + format (remplace black/isort/flake8) ----
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "UP",            # pyupgrade
  "B",             # bugbear
  "C4",            # comprehensions
  "SIM",           # simplify
  "ASYNC",         # async-specific checks
]
ignore = ["B008"]  # FastAPI Depends() dans les valeurs par défaut

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---- Mypy ----
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["alembic"]

# ---- Pytest ----
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
